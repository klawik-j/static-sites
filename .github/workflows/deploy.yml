name: Deploy static sites

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: deploy-master
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply infrastructure and site content
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-central-1
      TF_IN_AUTOMATION: true

    steps:
      - name: Check out merged source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve AWS account
        id: account
        run: echo "id=$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Initialize Terraform
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=static-sites-terraform-state-${{ steps.account.outputs.id }}" \
            -backend-config="key=static-sites/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true"

      - name: Validate Terraform
        working-directory: infra
        run: terraform validate

      - name: Create deployment plan
        working-directory: infra
        run: terraform plan -input=false -out=tfplan

      - name: Apply deployment plan
        working-directory: infra
        run: terraform apply -input=false -auto-approve tfplan