name: Deploy static sites

on:
  push:
    branches:
      - master
    paths:
      - "infra/**"
      - "!infra/bootstrap/**"
      - "sites/**"
      - ".github/workflows/deploy.yaml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-master
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  deploy:
    name: Apply infrastructure and site content
    runs-on: ubuntu-latest

    steps:
      - name: Check out merged source
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.12.2
          terraform_wrapper: false

      - name: Initialize Terraform
        working-directory: infra
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=static-sites/terraform.tfstate" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        working-directory: infra
        run: terraform validate

      - name: Create deployment plan
        working-directory: infra
        run: terraform plan -lock-timeout=5m -out=tfplan

      - name: Apply deployment plan
        working-directory: infra
        run: terraform apply -lock-timeout=5m -auto-approve tfplan

      - name: Invalidate CloudFront caches
        working-directory: infra
        run: |
          terraform output -json distribution_ids \
            | jq -r 'to_entries[] | "\(.key) \(.value)"' \
            | while read -r site distribution_id; do
                echo "Invalidating $site ($distribution_id)"
                aws cloudfront create-invalidation \
                  --distribution-id "$distribution_id" \
                  --paths '/*' \
                  --query 'Invalidation.Id' \
                  --output text
              done

      - name: Publish site URLs
        working-directory: infra
        run: |
          {
            echo "### Deployed sites"
            echo
            terraform output -json site_urls | jq -r 'to_entries[] | "- **\(.key)**: \(.value)"'
          } >> "$GITHUB_STEP_SUMMARY"